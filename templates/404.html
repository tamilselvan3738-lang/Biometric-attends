{% extends 'base.html' %}
{% block title %}Page Not Found (404){% endblock %}
{% block content %}
<div class="container d-flex flex-column align-items-center justify-content-center text-center py-5">
    <div class="glass-card p-5 max-width-600">
        <i class="fas fa-search text-warning mb-4" style="font-size: 5rem; text-shadow: 0 0 15px rgba(245, 158, 11, 0.4);"></i>
        <h1 class="fw-bold text-light mb-3">404 - Page Not Found</h1>
        <p class="text-secondary mb-4">The route you requested could not be resolved by the system.</p>
        <a href="{% url 'dashboards:dispatcher' %}" class="btn btn-glow-primary">
            <i class="fas fa-home me-2"></i>Return to Dashboard
        </a>
    </div>
</div>
{% endblock %}
