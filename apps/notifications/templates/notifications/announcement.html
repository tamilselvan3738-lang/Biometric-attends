{% extends 'base.html' %}
{% block title %}Publish Announcement | Biometric Attendance System{% endblock %}

{% block content %}
<div class="row">
    <div class="col-md-12 mb-4">
        <h2 class="fw-bold text-light">Publish Announcement</h2>
        <p class="text-secondary">Broadcast informational alerts or bulletins to employees or admin staff.</p>
    </div>
</div>

<div class="row">
    <div class="col-lg-6 mx-auto">
        <div class="glass-card p-4">
            <h5 class="fw-bold text-light mb-4 pb-2 border-bottom border-secondary">
                <i class="fas fa-bullhorn me-2 text-primary"></i>Announcement Details
            </h5>
            
            <form method="POST">
                {% csrf_token %}
                
                <div class="mb-3">
                    <label class="form-label text-secondary">Bulletin Title</label>
                    <input type="text" name="title" class="form-control bg-dark text-light border-secondary" placeholder="Enter headline..." required>
                </div>
                
                <div class="mb-3">
                    <label class="form-label text-secondary">Audience Target</label>
                    <select name="target_role" class="form-select bg-dark text-light border-secondary">
                        <option value="ALL">All Accounts</option>
                        <option value="ADMINS">Administrators Only</option>
                        <option value="EMPLOYEES">Employees Only</option>
                    </select>
                </div>
                
                <div class="mb-4">
                    <label class="form-label text-secondary">Content Message</label>
                    <textarea name="content" class="form-control bg-dark text-light border-secondary" rows="5" placeholder="Type bulletin content..." required></textarea>
                </div>
                
                <div class="d-flex gap-2">
                    <button type="submit" class="btn btn-glow-primary">
                        <i class="fas fa-check-circle me-2"></i>Publish Bulletin
                    </button>
                    <a href="{% url 'notifications:list' %}" class="btn btn-outline-secondary">
                        Cancel
                    </a>
                </div>
            </form>
        </div>
    </div>
</div>
{% endblock %}
